name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Soroban target
        run: rustup target add wasm32-unknown-unknown

      - name: Build Soroban contract
        run: cargo build --manifest-path ./contracts/hello_world/Cargo.toml

      - name: Run Soroban contract tests
        run: cargo test --manifest-path ./contracts/hello_world/Cargo.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Type-check mobile app
        working-directory: mobile-app
        run: npx tsc --noEmit
